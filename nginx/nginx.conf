events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS, so scaled gateway replicas are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream gateway_pool {
        zone gateway_pool 64k;
        server gateway:8000 resolve;
    }

    server {
        listen 80;
        server_tokens off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location ~ ^/(v1|admin|health|docs|openapi\.json) {
            proxy_pass http://gateway_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 120s;
            client_max_body_size 1m;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
